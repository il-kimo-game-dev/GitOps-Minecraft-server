apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-server
spec:
  values:
    minecraftServer:
      rcon:
        password: "kind-dev-rcon"
      # Server-side dependencies of the mod under development
      modrinth:
        projects:
          - fabric-api
          - fabric-language-kotlin
    # Mod jars dropped in kind/mods (mounted into the kind node, see kind/kind_dev-config.yaml)
    extraVolumes:
      - volumes:
          - name: local-mods
            hostPath:
              path: /mods-dev
              type: Directory
        volumeMounts:
          - name: local-mods
            mountPath: /mods
            readOnly: true
