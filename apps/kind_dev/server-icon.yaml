# Server icon as a ConfigMap. Flux's source-controller drops *.png files from
# its artifacts, so the image is embedded base64-encoded instead of using a
# configMapGenerator. Regenerate from assets/server-icon-64.png with:
#   magick assets/minecraft-modding-pic.png -resize 64x64 -strip assets/server-icon-64.png
#   base64 -w0 assets/server-icon-64.png
apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-server-icon
  namespace: minecraft
binaryData:
  server-icon.png: ""
