kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Paths are relative to the directory kind is run from (the repo root).
    extraMounts:
      # Mod jars under test, mounted into the Minecraft pod at /mods
      - hostPath: kind/mods
        containerPath: /mods-dev
        readOnly: true
    extraPortMappings:
      # Minecraft server (NodePort 30565 in apps/base/minecraft/release.yaml)
      - containerPort: 30565
        hostPort: 25565
        protocol: TCP
